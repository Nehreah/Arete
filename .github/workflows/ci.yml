name: CI Aréte

on:
  push:
    branches: [ main, 'mejoras/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─── Paso 0: Detección de secretos ──────────────────────────────────────────
  # Analiza TODO el historial de commits, no solo el diff del PR.
  # Bloquea el merge si encuentra claves de API, tokens, o credenciales hardcoded.
  gitleaks:
    name: Detección de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historial completo para detectar claves en commits anteriores
      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Paso 1: Build, Lint y Pruebas Unitarias ─────────────────────────────────
  build_and_test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v4

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Validar arquitectura descentralizada soberana y contratos de calidad
        run: |
          python3 scripts/validar-descentralizacion-soberana.py
          python3 scripts/miausnake/phase7_check.py .

      - name: Validar integridad de entrega (sin local.properties)
        run: python3 scripts/validar-integridad-entrega.py

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Aceptar licencias de Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Pruebas Unitarias
        run: ./gradlew testDebugUnitTest

      - name: Análisis estático (Lint)
        run: ./gradlew lintDebug

      - name: Publicar reporte de Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Compilar Debug
        run: ./gradlew assembleDebug

      - name: Compilar Release (sin firma de distribución)
        run: ./gradlew assembleRelease

      - name: Verificar Compilación Reproducible (Bit-by-Bit Determinism)
        run: python3 scripts/verificar-compilacion-reproducible.py
